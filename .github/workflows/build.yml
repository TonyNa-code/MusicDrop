name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MusicDrop.slnx --configfile NuGet.Config
      - name: Build
        run: dotnet build MusicDrop.slnx -c Release --no-restore
      - name: Package vulnerability audit
        run: dotnet list MusicDrop3/MFlacDrop.csproj package --vulnerable --include-transitive
      - name: Portable package vulnerability audit
        run: dotnet list MusicDrop.Desktop/MusicDrop.Desktop.csproj package --vulnerable --include-transitive
      - name: Cross-platform core harness
        run: dotnet run --project MusicDrop.Core.Harness/MusicDrop.Core.Harness.csproj -c Release --no-build
      - name: Portable CLI smoke
        run: dotnet run --project MusicDrop3.Portable.Cli/MusicDrop3.Portable.Cli.csproj -c Release --no-build -- --version
      - name: CLI smoke
        run: dotnet run --project MusicDrop3.Cli/MusicDrop3.Cli.csproj -c Release --no-build -- --version
      - name: Community license smoke
        run: dotnet run --project MusicDrop3.Cli/MusicDrop3.Cli.csproj -c Release --no-build -- --license-status
      - name: Publish GUI
        run: dotnet publish MusicDrop3/MFlacDrop.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/gui
      - name: Publish CLI
        run: dotnet publish MusicDrop3.Cli/MusicDrop3.Cli.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/cli
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MusicDrop-community-win-x64-slim
          path: |
            artifacts/gui/MusicDrop3.exe
            artifacts/cli/MusicDrop3.Cli.exe
            LICENSE
            THIRD-PARTY-NOTICES.md
            TRADEMARKS.md
            PRIVACY.md
