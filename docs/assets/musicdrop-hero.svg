<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">MusicDrop</title>
  <desc id="desc">A local-first verified batch audio converter</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a24"/>
      <stop offset="0.55" stop-color="#07194b"/>
      <stop offset="1" stop-color="#0b3270"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
